<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Draw Gane - Accuracy Drawing Challenge</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="game-bar" aria-label="Game status">
      <div class="stats-strip" aria-live="polite">
        <div>
          <span class="label">Time</span>
          <strong id="timer">03:00</strong>
        </div>
        <div>
          <span class="label">Accuracy</span>
          <strong id="score">--%</strong>
        </div>
        <div>
          <span class="label">Status</span>
          <strong id="status-text">Ready</strong>
        </div>
      </div>
      <div class="actions" id="action-bar"></div>
    </section>

    <section class="studio-grid" aria-label="Drawing game area">
      <article class="card reference-card">
        <div class="card-heading">
          <h2>Original</h2>
          <span>Copy this</span>
        </div>
        <canvas id="reference-canvas" width="420" height="420" aria-label="Original simple drawing"></canvas>
      </article>

      <article class="card drawing-card">
        <div class="card-heading">
          <h2>Your redraw</h2>
          <span id="brush-label">Brush: black, 14px</span>
        </div>
        <canvas id="drawing-canvas" width="420" height="420" aria-label="Drawing canvas"></canvas>
        <div class="drawing-tools" id="tool-panel" aria-label="Drawing tools"></div>
        <div class="result-panel" id="result-panel" hidden>
          <div class="meter" aria-hidden="true"><span id="meter-fill"></span></div>
        </div>
      </article>
    </section>

    <canvas id="comparison-canvas" width="420" height="420" hidden></canvas>
  </main>
  <script src="script.js"></script>
</body>
</html>
